name: Build aplikasi Windows

on:
  workflow_dispatch:        # jalankan manual: tab Actions > Build aplikasi Windows > Run workflow
  push:
    tags: ['v*']            # atau buat tag, mis. v1.0.1, untuk merilis otomatis

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Build installer dan versi portable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: Buku-Surat-TU-Windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error

      - name: Rilis di GitHub Releases (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
